<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Bell-state circuit with time markers</title>
  <desc id="desc">Two qubits initialized to zero. A Hadamard gate acts on q0, followed by CNOT controlled by q0 targeting q1. Dotted vertical lines mark t0 before Hadamard, t1 after Hadamard, and t2 after CNOT.</desc>
  <rect width="1200" height="620" rx="20" fill="#fff"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#172b4d">
    <text x="600" y="65" text-anchor="middle" font-size="36">Bell-State Circuit</text>
    <text x="600" y="105" text-anchor="middle" font-size="21" fill="#52627a">Hadamard on q₀, then CNOT with q₀ as control</text>
    <g stroke="#172b4d" stroke-width="3.5">
      <path d="M230 220 H1030 M230 350 H1030" fill="none"/>
    </g>
    <g stroke="#8c9bb0" stroke-width="2.5" stroke-dasharray="3 10" stroke-linecap="round">
      <path d="M320 155 V410 M640 155 V410 M960 155 V410"/>
    </g>
    <g font-size="31" text-anchor="end">
      <text x="205" y="230">q₀ : |0⟩</text>
      <text x="205" y="360">q₁ : |0⟩</text>
    </g>
    <rect x="445" y="181" width="78" height="78" rx="3" fill="#edf4ff" stroke="#172b4d" stroke-width="3.5"/>
    <text x="484" y="233" text-anchor="middle" font-size="40" font-style="italic">H</text>
    <g stroke="#172b4d" stroke-width="3.5">
      <path d="M800 220 V350"/>
      <circle cx="800" cy="220" r="10" fill="#172b4d"/>
      <circle cx="800" cy="350" r="21" fill="#fff"/>
      <path d="M779 350 H821 M800 329 V371"/>
    </g>
    <g font-size="30">
      <text x="1060" y="230">q₀</text>
      <text x="1060" y="360">q₁</text>
    </g>
    <g text-anchor="middle" font-size="31" font-style="italic">
      <text x="320" y="450">t₀</text>
      <text x="640" y="450">t₁</text>
      <text x="960" y="450">t₂</text>
    </g>
    <g text-anchor="middle" font-size="26">
      <text x="320" y="505">|00⟩</text>
      <text x="640" y="505">(|00⟩ + |10⟩) / √2</text>
      <text x="960" y="505">(|00⟩ + |11⟩) / √2</text>
    </g>
    <text x="600" y="575" text-anchor="middle" font-size="21" fill="#52627a">Basis ordering: |q₀q₁⟩</text>
  </g>
</svg>
