baseURL = 'https://kaizen.shinchan75034.workers.dev/'
languageCode = 'en-us'
title = "My Notebook"
theme = 'PaperMod'

pagination.pagerSize = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  env = 'production'
  description = "Writing, notes, and things I'm working on."
  author = 'Isaid22'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hidemeta = false

  [params.homeInfoParams]
    Title = "Hi, I'm writing for pleasure 👋"
    Content = "This is where I write things, keep notes on what I'm doing, and think out loud."

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/'

  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    style = 'monokai'

[[menu.main]]
  identifier = 'posts'
  name = 'Writing'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'notes'
  name = 'Notes'
  url = '/notes/'
  weight = 20

[[menu.main]]
  identifier = 'tags'
  name = 'Tags'
  url = '/tags/'
  weight = 30

[[menu.main]]
  identifier = 'search'
  name = 'Search'
  url = '/search/'
  weight = 40

[[menu.main]]
  identifier = 'archive'
  name = 'Archive'
  url = '/archive/'
  weight = 50
